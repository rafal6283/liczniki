name: Zbuduj APK

on:
  push:
    branches: [main]
    paths-ignore: ['ios/**', '.github/workflows/ios.yml', '**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk kreska.apk
      - name: Zgłoś błędy kompilacji
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - name: Logi (gałąź ci-android)
        if: always()
        run: |
          mkdir -p /tmp/l && grep -E "^e: |^w: |error:|What went wrong|BUILD" -A3 build.log | head -300 > /tmp/l/errors.log || true
          tail -120 build.log > /tmp/l/tail.log || true
          echo "run ${GITHUB_RUN_NUMBER} ${GITHUB_SHA} $(date -u +%FT%TZ)" > /tmp/l/run.txt
          cd /tmp/l && git init -q && git checkout -q -b ci-android
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "logi ${GITHUB_RUN_NUMBER}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-android || true
      - name: Opublikuj w Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kreska 1.0.${{ github.run_number }}
          body: "Pobierz plik **kreska.apk** na telefonie i zainstaluj (aktualizuje poprzednią wersję, dane zostają)."
          files: kreska.apk
          make_latest: true
