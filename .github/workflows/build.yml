name: Zbuduj APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk kreska.apk
      - name: Opublikuj w Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kreska 1.0.${{ github.run_number }}
          body: "Pobierz plik **kreska.apk** na telefonie i zainstaluj (aktualizuje poprzednią wersję, dane zostają)."
          files: kreska.apk
          make_latest: true
